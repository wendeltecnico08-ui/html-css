<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banner Promocional</title>

<style>

*{
margin: 0;
padding: 0;
box-sizing: border-box;
}

.banner-promocional{
position: relative;
width: 100%;
height: 400px;
overflow: hidden;
}

.banner-promocional img{
width: 100%;
height: 100%;
object-fit: cover;
}

.conteudo-banner{
position: absolute;
top: 50%;
left: 50%;
transform: translate(-50%, -50%);

background: rgba(0, 0, 0, 0.6);
padding: 30px;
border-radius: 10px;

text-align: center;
color: white;
}

.conteudo-banner h1{
font-size: 40px;
margin-bottom: 10px;
}

.conteudo-banner p{
font-size: 22px;
margin-bottom: 20px;
}

.conteudo-banner button{
padding: 12px 25px;
border: none;
border-radius: 5px;
background-color: orange;
color: white;
font-size: 16px;
cursor: pointer;
}

.conteudo-banner button:hover{
background-color: darkorange;
}

</style>
</head>

<body>

<div class="banner-promocional">

<img src="https://picsum.photos/1200/400" alt="Banner promocional">

<div class="conteudo-banner">
<h1>Oferta Especial</h1>
<p>30% OFF nos cursos</p>
<button>Comprar Agora</button>
</div>

</div>

</body>
</html>
